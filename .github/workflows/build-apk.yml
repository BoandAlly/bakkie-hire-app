name: Build Android APK

on:
  push:
    branches: [ main, master ]
  # Run by hand, optionally without the backend. A build with no backend is the
  # single-device app: it saves only to the phone it's on and shares nothing, so
  # it can be handed round for trying out changes without touching real test data.
  workflow_dispatch:
    inputs:
      include_backend:
        description: 'Connect to the shared Supabase backend'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A push always builds the real, backend-connected app. Only a hand-run
    # build can opt out, and it has to say so explicitly.
    env:
      WITH_BACKEND: ${{ github.event_name != 'workflow_dispatch' || inputs.include_backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      # Without these the build still SUCCEEDS — Vite just compiles the backend
      # out, and you get an APK that installs fine and silently never syncs.
      # Failing here instead makes that impossible to ship by accident.
      - name: Check backend config is present
        if: env.WITH_BACKEND == 'true'
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Missing VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY."
            echo "Add them under Settings -> Secrets and variables -> Actions."
            echo "Without them the APK builds but has no backend, so phones will not sync."
            exit 1
          fi
          echo "Backend config present."

      - name: Build web assets (with backend)
        if: env.WITH_BACKEND == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Optional — real house-number addresses via TomTom. If the secret is
          # unset it's empty and the app falls back to the free map; the build
          # does NOT fail without it (unlike the Supabase keys above).
          VITE_TOMTOM_API_KEY: ${{ secrets.VITE_TOMTOM_API_KEY }}
        run: npm run build

      # Deliberately no Supabase env: Vite folds the config check to false and
      # compiles Supabase out entirely, so this APK cannot reach the shared data
      # even by accident. The TomTom key is separate from the shared backend
      # (it's just address search), so it still rides along if present.
      - name: Build web assets (no backend)
        if: env.WITH_BACKEND != 'true'
        env:
          VITE_TOMTOM_API_KEY: ${{ secrets.VITE_TOMTOM_API_KEY }}
        run: |
          echo "Building WITHOUT the backend — this APK saves only to the phone it is on."
          npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bakkie-hire-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
